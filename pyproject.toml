[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "txt2audio"
version = "0.1.0"
description = "Transform txt book to audio book with TTS models"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "Pillow>=9.0.0",
    "scipy",
    "charset-normalizer",
    "librosa",
    "torch>=2.3.1,<2.4",
    "torchaudio>=2.3.1,<2.4",
    "transformers>=4.51.3,<4.52",
    "onnxruntime>=1.18.0,<1.19",
    "conformer==0.3.2",
    "diffusers>=0.29.0",
    "huggingface-hub",
    "hydra-core==1.3.2",
    "HyperPyYAML>=1.2.2",
    "inflect>=7.3.1",
    "omegaconf==2.3.0",
    "openai-whisper>=20231117",
    "protobuf>=4.25",
    "pydantic>=2.7.0",
    "soundfile>=0.12.1",
    "wetext>=0.0.4",
    "modelscope>=1.34.0",
    "lightning>=2.6.1",
    "rich>=14.3.3",
    "gdown>=5.2.1",
    "matplotlib>=3.10.8",
    "wget>=3.2",
    "x-transformers>=2.16.2",
    "pyarrow>=23.0.1",
    "pyworld>=0.3.5",
    "pypinyin>=0.53.0",
]
[project.scripts]
txt2audio = "transform_to_audio:main"
txt2audio-mcp = "txt2audio_mcp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools"]
