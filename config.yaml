# ============================================================
# txt2audio 配置文件
# 修改此文件即可自定义 TTS、音频、视频等参数，无需改代码
# ============================================================

# TTS 语音合成
tts:
  # 模型目录（相对于项目根目录）
  model_dir: pretrained_models/Fun-CosyVoice3-0.5B
  # 说话人参考音频（零样本克隆的声音来源）
  speaker_wav: resources/my_speaker.wav
  # 零样本 TTS 提示文本
  prompt_text: "You are a helpful assistant.<|endofprompt|>希望你以后能够做的比我还好呦。"

# 音频生成
audio:
  # 每个音频片段的汉字上限（约 30 分钟）
  chinese_word_limit_half_hour: 6300
  # TTS 模型单次输入的字符上限
  model_sentence_limit: 200

# 视频封面
video:
  # 封面图尺寸（像素）
  width: 720
  height: 1280
  # 字体大小
  font_size_title: 80
  font_size_subtitle: 70
  font_size_number: 40
  # FFmpeg 编码参数
  ffmpeg_video_codec: libx264
  ffmpeg_audio_codec: aac
  ffmpeg_audio_bitrate: 192k
  ffmpeg_pixel_format: yuv420p
  ffmpeg_tune: stillimage

# 路径（相对于项目根目录）
paths:
  resources_dir: resources
  output_dir: output

# 文本处理
text_processing:
  # 书籍结构分隔符（按字符迭代匹配：先卷后章）
  book_delimiter: 卷章
