# ============================================================
# txt2audio 配置文件
# 修改此文件即可自定义 TTS、音频、视频等参数，无需改代码
# ============================================================

# TTS 语音合成
tts:
  # 模型目录（相对于项目根目录）
  model_dir: pretrained_models/Fun-CosyVoice3-0.5B
  # 说话人参考音频（零样本克隆的声音来源）
  speaker_wav: resources/my_speaker.wav
  # 零样本 TTS 提示文本（<|endofprompt|> 后的中文必须与 speaker_wav 中说的内容完全一致）
  prompt_text: "You are a helpful assistant.<|endofprompt|>他站在城墙上，望着远处的千军万马，脸上没有一丝慌乱。"
  # 语速：1.0=正常，<1.0=慢，>1.0=快（有声书建议 0.9~1.0，低于 0.85 会失真）
  speed: 1.05
  # 句间静音填充（毫秒），增加自然停顿感（0=禁用，建议 100~200）
  inter_sentence_silence_ms: 150

# 音频生成
audio:
  # 每个音频片段的汉字上限（-1 表示不分片，整章一个文件）
  max_chars_per_clip: 6300
  # TTS 模型单次输入的字符上限（仅供参考，代码不读取此值；实际分句由 CosyVoice 内部 split_paragraph 处理）
  model_sentence_limit: 2000
  # 纯音频模式的输出格式：mp3（推荐，体积小兼容好）或 wav（无压缩）
  output_format: mp3
  # MP3 码率（语音建议 128k，音乐建议 192k+）
  mp3_bitrate: 128k

# 视频封面
video:
  # 画面方向：portrait (竖屏 720x1280) | landscape (横屏 1280x720)
  orientation: portrait
  # 封面图尺寸（像素）
  width: 720
  height: 1280
  # 字体大小
  font_size_title: 80
  font_size_subtitle: 70
  font_size_number: 40
  # FFmpeg 编码参数
  ffmpeg_video_codec: libx264
  ffmpeg_video_crf: 28              # 静态图片容忍高 CRF（默认 23 过于保守）
  ffmpeg_video_preset: medium       # 编码预设（静态图编码很快，可用 slow 换更好压缩）
  ffmpeg_video_framerate: 1         # 静态封面只需 1fps
  ffmpeg_audio_codec: aac
  ffmpeg_audio_bitrate: 96k         # 语音 96k 足够（原 192k 浪费）
  ffmpeg_pixel_format: yuv420p
  ffmpeg_tune: stillimage
  # 封面图 JPEG 质量（纯色背景+文字，70 足够）
  cover_jpeg_quality: 70
  # 字幕设置（仅 --video 模式生效）
  subtitles: true                     # 是否烧入字幕（默认开启）
  subtitle_style: "FontSize=22,PrimaryColour=&H00ffff,Outline=1,OutlineColour=&H000000,Alignment=2,MarginL=40,MarginR=40,MarginV=95"
  subtitle_max_chars_per_line: 10  # 每行最大字符数（FontSize=22 在 720px 宽约显示 10 个汉字）
  subtitle_max_lines: 2            # 字幕最大行数（超出则拆分为多条字幕，按时间比例分配）

# 路径（相对于项目根目录）
paths:
  resources_dir: resources
  output_dir: output

# 文本处理
text_processing:
  # 书籍结构分隔符（按字符迭代匹配：先卷后章）
  book_delimiter: 卷章
